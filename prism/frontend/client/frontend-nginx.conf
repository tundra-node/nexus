server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Strip /dashboard/ prefix from incoming requests
    rewrite ^/dashboard/(.*) /$1 break;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
