## Prism — i2pd configuration
## Bind all services to 0.0.0.0 for container use

log = file
loglevel = warn

ipv4 = true
ipv6 = false

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[http]
enabled = true
address = 0.0.0.0
port = 7070

[httpproxy]
enabled = true
address = 0.0.0.0
port = 4444
keys = http-proxy-keys.dat

[socksproxy]
enabled = true
address = 0.0.0.0
port = 4447

[i2pcontrol]
enabled = true
address = 0.0.0.0
port = 7650

[sam]
enabled = true
address = 0.0.0.0
port = 7656

[upnp]
enabled = false

[addressbook]
subscriptions = http://reg.i2p/hosts.txt

[reseed]
verify = true
