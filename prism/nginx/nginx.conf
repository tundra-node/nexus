worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker embedded DNS resolver — allows lazy resolution for upstreams
    resolver 127.0.0.11 valid=10s;

    # Larger proxy buffers for Wayback content
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;

    # Upstream backend services (resolved at startup, must be available)
    upstream api-router       { server api-router:8001; }
    upstream api-browser      { server api-browser:8002; }
    upstream api-addressbook  { server api-addressbook:8005; }

    server {
        listen 80;
        server_name _;

        # Large request body for Wayback captures
        client_max_body_size 50M;

        # ── Health ──
        location /health {
            proxy_pass http://api-router;
            proxy_set_header Host $host;
        }

        # ── Specific API services (longest prefix wins) ──
        location /api/browser/ {
            proxy_pass http://api-browser;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/addressbook/ {
            proxy_pass http://api-addressbook;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;  # Addressbook fetches can be slow
        }

        # ── Default /api/ → router dashboard ──
        # Catches: /api/status, /api/bandwidth, /api/tunnels,
        #          /api/router-info, /api/router-details, /api/config,
        #          /api/commands, /api/command/*, /api/transports,
        #          /api/local-destinations
        location /api/ {
            proxy_pass http://api-router;
            proxy_set_header Host $host;
        }

        # ── Frontend (via variable for lazy DNS resolution) ──
        set $frontend_upstream http://frontend:80;
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
