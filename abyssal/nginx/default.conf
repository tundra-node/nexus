# Abyssal public frontend (search engine - default page)
server {
    listen 80;
    server_name _;

    # Abyssal API
    location /api/abyssal/ {
        proxy_pass http://abyssal-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prism private API health (un-prefixed on backend)
    location = /api/health {
        proxy_pass http://prism-router:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prism private APIs — un-prefixed routes (/api/status, /api/bandwidth, etc)
    location /api/ {
        proxy_pass http://prism-router:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prism private APIs — prefixed routes
    location /api/router/ {
        rewrite ^/api/router/(.*) /api/$1 break;
        proxy_pass http://prism-router:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/browser/ {
        proxy_pass http://prism-browser:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }

    location /api/addressbook/ {
        proxy_pass http://prism-addressbook:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prism frontend (private dashboard)
    location /dashboard/ {
        proxy_pass http://prism-frontend:80;
        proxy_set_header Host $host;
    }

    # Abyssal frontend (search engine - default)
    location / {
        proxy_pass http://abyssal-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
