[project]
name = "abyssal"
version = "0.1.0"
description = "I2P search engine — crawler, classifier, resolver, wayback, and full-text search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.3",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abyssal*"]
